name: Module preview
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Whitespace (including the initial commit)
        run: git diff-tree --check --root -r HEAD
      - name: Unit contracts and structure
        run: php test/unit/run.php
      - uses: actions/checkout@v4
        with:
          repository: Dolibarr/dolibarr
          ref: 88ad132763be45e9620128c1830e41493e1cdd05
          path: .test-core
          persist-credentials: false
      - name: Preview calculations against V22 calendar APIs
        env:
          DOLIBARR_TEST_ROOT: ${{ github.workspace }}/.test-core
        run: php test/unit/preview.php
